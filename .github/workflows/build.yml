name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Needed to publish a GitHub Release when a v* tag is pushed.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/Notchify/Notchify.csproj -c Release
      - name: Publish (single file, x64 + arm64)
        run: |
          dotnet publish src/Notchify/Notchify.csproj -c Release -r win-x64   --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64
          dotnet publish src/Notchify/Notchify.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-arm64
      - uses: actions/upload-artifact@v5
        with:
          name: NotchX
          path: publish/
      # Microsoft Store package (unsigned: the Store signs it on upload). Kept as a build artifact,
      # not a release download, because an unsigned .msix can't be installed outside the Store.
      - name: Store package (MSIX)
        shell: powershell
        run: ./packaging/build-msix.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: NotchX-Store
          path: msix-out/*.msixbundle
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive publish/win-x64/* NotchX-win-x64.zip
          Compress-Archive publish/win-arm64/* NotchX-win-arm64.zip
          gh release create $env:GITHUB_REF_NAME NotchX-win-x64.zip NotchX-win-arm64.zip --generate-notes
